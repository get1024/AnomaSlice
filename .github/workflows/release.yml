name: Build AnomaSlice

# 配置触发条件
on:
  push:
    tags:
      - 'v*' # 只有当你推送类似 "v1.0.0" 的标签时，才会触发自动打包
  workflow_dispatch: # 允许你在 GitHub 网页上手动点击运行测试

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest # 使用最新的 Windows 环境进行打包
    timeout-minutes: 20

    steps:
    - name: 检出代码 (Checkout code)
      uses: actions/checkout@v4

    - name: 配置 Python 环境 (Set up Python)
      uses: actions/setup-python@v5
      with:
        python-version: '3.12' # 建议与你本地开发使用的版本保持一致

    - name: Install build dependencies
      run: python -m pip install -r requirements-build.txt

    - name: Test annotation and slicing workflows
      env:
        QT_QPA_PLATFORM: offscreen
        PYTHONUTF8: '1'
      run: python -m unittest discover -s tests -v

    - name: Build single-file Windows application
      shell: pwsh
      run: ./build-windows.ps1 -Python (Get-Command python).Source

    - name: Upload single-file application
      uses: actions/upload-artifact@v4
      with:
        name: AnomaSlice-Windows-x64
        path: dist/AnomaSlice.exe
        if-no-files-found: error

  build-macos:
    name: Build macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - name: Test annotation and slicing workflows
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Test trackpad interaction on Cocoa
        env:
          QT_QPA_PLATFORM: cocoa
        run: python -m unittest discover -s tests -p test_bbox_canvas.py -k test_mac_ -v
      - name: Build and test the Mac application
        run: bash build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AnomaSlice-macOS-${{ matrix.arch }}
          path: dist/AnomaSlice-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: AnomaSlice ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          make_latest: 'true'
          fail_on_unmatched_files: true
          files: |
            dist/AnomaSlice.exe
            dist/AnomaSlice-macOS-arm64.zip
            dist/AnomaSlice-macOS-x86_64.zip
