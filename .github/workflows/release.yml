name: Build and Release EXE

# 配置触发条件
on:
  push:
    tags:
      - 'v*' # 只有当你推送类似 "v1.0.0" 的标签时，才会触发自动打包
  workflow_dispatch: # 允许你在 GitHub 网页上手动点击运行测试

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest # 使用最新的 Windows 环境进行打包
    timeout-minutes: 20

    steps:
    - name: 检出代码 (Checkout code)
      uses: actions/checkout@v4

    - name: 配置 Python 环境 (Set up Python)
      uses: actions/setup-python@v5
      with:
        python-version: '3.12' # 建议与你本地开发使用的版本保持一致

    - name: Install build dependencies
      run: python -m pip install -r requirements-build.txt

    - name: Test annotation and slicing workflows
      env:
        QT_QPA_PLATFORM: offscreen
        PYTHONUTF8: '1'
      run: python -m unittest discover -s tests -v

    - name: Build single-file Windows application
      shell: pwsh
      run: ./build-windows.ps1 -Python (Get-Command python).Source

    - name: Upload single-file application
      uses: actions/upload-artifact@v4
      with:
        name: AnomaSlice-Windows-x64
        path: dist/AnomaSlice.exe
        if-no-files-found: error
        
    - name: 发布到 GitHub Releases (Create Release)
      uses: softprops/action-gh-release@v2
      # 仅在通过 Tag 触发时才创建 Release
      if: startsWith(github.ref, 'refs/tags/')
      with:
        name: AnomaSlice ${{ github.ref_name }}
        body_path: RELEASE_NOTES.md
        generate_release_notes: true
        make_latest: 'true'
        fail_on_unmatched_files: true
        files: dist/AnomaSlice.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # GitHub 自动提供的密钥，无需手动配置
